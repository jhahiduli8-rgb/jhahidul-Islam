<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 20px;
            background-color: var(--tg-theme-bg-color, #ffffff);
            color: var(--tg-theme-text-color, #333333);
        }
        button {
            background-color: var(--tg-theme-button-color, #2481cc);
            color: var(--tg-theme-button-text-color, #ffffff);
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h1>স্বাগতম!</h1>
    <p>এটি আপনার প্রথম টেলিগ্রাম মিনি অ্যাপ।</p>
    <button id="mainButton">কাজ শুরু করুন</button>

    <script>
        // টেলিগ্রাম ওয়েব অ্যাপ ইনিশিয়ালাইজ করা
        const tg = window.Telegram.WebApp;
        tg.ready();

        // মেনু বা মেইন বাটনে ক্লিক করলে অ্যাকশন
        document.getElementById('mainButton').addEventListener('click', () => {
             tg.showAlert("আপনি বাটনে ক্লিক করেছেন!");
        });
    </script>
</body>
</html>
