<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Good App</title>
    <style>
        body {
            background-color: #f7f7f7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 60px;
        }

        .header {
            background-color: #ffc107;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
        }

        .header h2 {
            margin: 0;
        }

        .content {
            padding: 15px;
        }

        .card {
            background-color: #ffffff;
            border-radius: 15px;
            padding: 15px;
            margin-bottom: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

         .grid-item {
            text-align: center;
            background-color: #f0f4f8;
            padding: 10px;
             border-radius: 10px;
        }

        .grid-item img {
            width: 30px;
            height: 30px;
             margin-bottom: 5px;
        }

        .grid-item span {
            display: block;
            font-size: 12px;
            color: #333;
            font-weight: bold;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }

        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #888;
             cursor: pointer;
        }

         .nav-item.active {
            color: #ffc107;
        }

         .nav-item img {
             width: 24px;
             height: 24px;
             display: block;
             margin: 0 auto;
         }

        .verify-box {
            background-color: #fff8e1;
             border-left: 5px solid #ffc107;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-icon">☰</div>
        <h2>Life Good</h2>
        <div class="notif">🔔</div>
    </div>

    <div class="content">
        <div class="card verify-box">
            <div class="section-title">Profile Verification</div>
            <p>Verify your profile now.</p>
            <button style="background-color: #ffc107; border: none; padding: 10px; border-radius: 5px; width: 100%; font-weight: bold;">Verify Account</button>
        </div>

        <div class="card">
            <div class="section-title">Easy Earning</div>
            <div class="grid">
                <div class="grid-item">
                    <span>Ads</span>
                </div>
                <div class="grid-item">
                    <span>Quiz</span>
                </div>
                 <div class="grid-item">
                    <span>Typing</span>
                </div>
                 <div class="grid-item">
                    <span>Marketing</span>
                </div>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">
             <span>Home</span>
        </div>
        <div class="nav-item">
            <span>Reels</span>
        </div>
        <div class="nav-item">
             <span>Reselling</span>
        </div>
         <div class="nav-item">
             <span>Micro Job</span>
        </div>
        <div class="nav-item">
             <span>Profile</span>
        </div>
    </div>
</body>
</html>
