<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>আমার মিনি অ্যাপ</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; background-color: var(--tg-theme-bg-color, #ffffff); color: var(--tg-theme-text-color, #333333); }
        button { background-color: var(--tg-theme-button-color, #2481cc); color: var(--tg-theme-button-text-color, #ffffff); border: none; padding: 10px 20px; font-size: 16px; border-radius: 5px; cursor: pointer; }
        select { padding: 5px; font-size: 14px; margin-bottom: 20px; }
    </style>
</head>
<body>
    <label for="langSelect">ভাষা নির্বাচন করুন: </label>
    <select id="langSelect" onchange="changeLanguage()">
        <option value="bn">বাংলা</option>
        <option value="en">English</option>
    </select>

    <h1 id="title">স্বাগতম!</h1>
    <p id="description">এটি আপনার প্রথম টেলিগ্রাম মিনি অ্যাপ।</p>
    <button id="mainButton" onclick="buttonAction()">কাজ শুরু করুন</button>

    <script>
        const tg = window.Telegram.WebApp;
        tg.ready();

        const translations = {
            'bn': { title: 'স্বাগতম!', description: 'এটি আপনার প্রথম টেলিগ্রাম মিনি অ্যাপ।', button: 'কাজ শুরু করুন', alert: 'আপনি বাটনে ক্লিক করেছেন!' },
            'en': { title: 'Welcome!', description: 'This is your first Telegram Mini App.', button: 'Start Working', alert: 'You clicked the button!' }
        };

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            document.getElementById('title').innerText = translations[lang].title;
            document.getElementById('description').innerText = translations[lang].description;
            document.getElementById('mainButton').innerText = translations[lang].button;
        }

        function buttonAction() {
            const lang = document.getElementById('langSelect').value;
            tg.showAlert(translations[lang].alert);
        }
    </script>
</body>
</html>
