<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giveaways</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
        }

        .header {
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
        }

        .card {
            background-color: #1a1a1a;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .card-info {
            display: flex;
            align-items: center;
        }

        .emoji {
            font-size: 30px;
            margin-right: 15px;
        }

        .details h3 {
            margin: 0 0 5px 0;
            font-size: 18px;
        }

        .details p {
            margin: 0;
            color: #888888;
            font-size: 14px;
        }

        .go-btn {
            background-color: #007bff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="header">🎁 Giveaways</div>

    <div class="card">
        <div class="card-info">
            <div class="emoji">💎</div>
            <div class="details">
                <h3>TON Giveaway</h3>
                <p>Get tickets and win!</p>
            </div>
        </div>
        <button class="go-btn">Go</button>
    </div>

    <div class="card">
        <div class="card-info">
            <div class="emoji">🏆</div>
            <div class="details">
                <h3>Referral contest</h3>
                <p>Invite your friends and win!</p>
            </div>
        </div>
        <button class="go-btn">Go</button>
    </div>

    <div class="card">
        <div class="card-info">
            <div class="emoji">⭐</div>
            <div class="details">
                <h3>Star Giveaway</h3>
                <p>Add stars to the pool</p>
            </div>
        </div>
        <button class="go-btn">Go</button>
    </div>
</body>
</html>
