<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Good</title>
    <style>
        body {
            background-color: #ffffff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding-bottom: 70px;
        }

        .header {
            background-color: #ffc107;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            color: #333;
        }

        .header h2 { margin: 0; }

        .content {
            padding: 15px;
        }

        .verify-card {
            background-color: #fff8e1;
            border-radius: 15px;
            padding: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #ffeeba;
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 10px;
            color: #333;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 15px;
            margin-bottom: 20px;
        }

        .grid-item {
            text-align: center;
        }

        .icon-circle {
            width: 50px;
            height: 50px;
            background-color: #e3f2fd;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: 0 auto 5px;
            font-size: 24px;
        }

        .grid-item span {
            display: block;
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }

        .nav-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            background-color: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            border-top: 1px solid #ddd;
        }

        .nav-item {
            text-align: center;
            font-size: 12px;
            color: #555;
            cursor: pointer;
        }

        .nav-item.active {
            color: #ffc107;
        }
    </style>
</head>
<body>
    <div class="header">
        <div class="menu-icon">☰</div>
        <h2>Life Good</h2>
        <div class="notif">🔔</div>
    </div>

    <div class="content">
        <div class="verify-card">
            <div>
                <div class="section-title">Profile Verification</div>
                <p>Verify your profile now.</p>
            </div>
            <button style="background-color: #ffc107; border: none; padding: 10px 15px; border-radius: 8px; font-weight: bold;">Verify Account</button>
        </div>

        <div class="section-title">Easy Earning</div>
        <div class="grid-container">
            <div class="grid-item">
                <div class="icon-circle"> Ads</div>
                <span>Ads</span>
            </div>
            <div class="grid-item">
                 <div class="icon-circle"> Quiz</div>
                <span>Quiz</span>
            </div>
            <div class="grid-item">
                 <div class="icon-circle"> Typing</div>
                <span>Typing</span>
            </div>
            <div class="grid-item">
                 <div class="icon-circle"> Ads</div>
                <span>Marketing</span>
            </div>
             <div class="grid-item">
                <div class="icon-circle"> Job</div>
                <span>Micro Job</span>
            </div>
            <div class="grid-item">
                 <div class="icon-circle"> Post</div>
                <span>Job Post</span>
            </div>
            <div class="grid-item">
                 <div class="icon-circle"> Book</div>
                <span>Courses</span>
            </div>
            <div class="grid-item">
                 <div class="icon-circle"> Data</div>
                <span>Digital Service</span>
            </div>
        </div>
    </div>

    <div class="nav-bar">
        <div class="nav-item active">
            <span>Home</span>
        </div>
        <div class="nav-item">
            <span>Reels</span>
        </div>
        <div class="nav-item">
            <span>Reselling</span>
        </div>
        <div class="nav-item">
            <span>Micro Job</span>
        </div>
        <div class="nav-item">
            <span>Profile</span>
        </div>
    </div>
</body>
</html>
