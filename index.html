<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Easy Earning App</title>
    <style>
        body {
            background-color: #FAFAF7;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .profile-card {
            background-color: #FFFFFF;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(76, 175, 80, 0.15);
            border: 1px solid #EAEAEA;
        }
        .profile-content {
            display: flex;
            align-items: center;
        }
        .badge {
            width: 50px;
            height: 50px;
            background-color: #E6F4EA;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 24px;
            margin-right: 15px;
            color: #4CAF50;
        }
        .profile-text h3 {
            margin: 0 0 5px 0;
            color: #4CAF50;
            font-size: 18px;
        }
        .profile-text p {
            margin: 0;
            color: #666;
            font-size: 14px;
        }
        .verify-btn {
            background-color: #F8B425;
            border: none;
            padding: 10px 15px;
            border-radius: 8px;
            color: #FFFFFF;
            font-weight: bold;
            cursor: pointer;
        }
        .notice-box {
            background-color: #FFFFFF;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            max-width: 400px;
            margin-bottom: 20px;
            box-shadow: 0 4px 20px rgba(244, 67, 54, 0.15);
            border: 1px solid #EAEAEA;
        }
        .notice-header {
            display: flex;
            align-items: center;
            color: #F44336;
            font-weight: bold;
            margin-bottom: 10px;
            font-size: 16px;
        }
        .notice-header span {
            margin-right: 8px;
            font-size: 20px;
        }
        .notice-text {
            color: #555;
            font-size: 14px;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="profile-content">
            <div class="badge">✔</div>
            <div class="profile-text">
                <h3>Profile Verification</h3>
                <p>Verify your profile now.</p>
            </div>
        </div>
        <button class="verify-btn">Verify Account</button>
    </div>

    <div class="notice-box">
        <div class="notice-header">
            <span>🚨</span> Urgent notice
        </div>
        <div class="notice-text">
            Do not pay anyone outside the app for verification. To verify, use only the in-app payment system.
        </div>
    </div>
</body>
</html>
